name: Actualizar Datos MetCam
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar lo básico
        run: pip install xarray numpy
      - name: Ejecutar
        run: python procesar_viento.py
      - name: Subir
        run: |
          git config --global user.name 'MetCam-Bot'
          git config --global user.email 'bot@metcam.cl'
          # El comando 'mkdir -p' asegura que la carpeta exista antes de agregar el archivo
          mkdir -p datos
          git add datos/viento_chile.json
          git commit -m "Datos listos" || exit 0
          git push
