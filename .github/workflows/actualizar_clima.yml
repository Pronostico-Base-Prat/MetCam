name: Actualizar Datos MetCam
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar Herramientas
        run: |
          pip install herbie xarray cfgrib numpy eccodes
      - name: Ejecutar
        run: python procesar_viento.py
      - name: Subir
        run: |
          git config --global user.name 'MetCam-Bot'
          git config --global user.email 'bot@metcam.cl'
          mkdir -p datos
          git add datos/viento_chile.json || echo "No hay cambios"
          git commit -m "Datos actualizados" || exit 0
          git push
